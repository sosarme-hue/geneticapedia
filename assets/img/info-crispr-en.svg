<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="How CRISPR works" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>How CRISPR works</title><rect width="960" height="580" rx="16" fill="#ffffff"/><text x="480.0" y="44" font-size="26" font-weight="700" fill="#1f2a37" text-anchor="middle">CRISPR-Cas9: find, cut, repair</text><text x="480.0" y="72" font-size="15" font-weight="400" fill="#5b6573" text-anchor="middle">Molecular scissors guided by an RNA</text><rect x="35.0" y="100" width="270" height="250" rx="16" fill="#f4f6f9" stroke="#7b4fb3" stroke-width="2"/><text x="170.0" y="134" font-size="19" font-weight="700" fill="#7b4fb3" text-anchor="middle">1. Find</text><rect x="60.0" y="232" width="220" height="10" rx="3" fill="#2b6cb0"/><rect x="60.0" y="256" width="220" height="10" rx="3" fill="#2b6cb0"/><ellipse cx="170.0" cy="236" rx="62" ry="46" fill="#7b4fb3" opacity=".18" stroke="#7b4fb3" stroke-width="2"/><rect x="130.0" y="208" width="80" height="8" rx="3" fill="#e8a33d"/><text x="170.0" y="198" font-size="12" font-weight="700" fill="#e8a33d" text-anchor="middle">guide RNA</text><text x="170.0" y="170" font-size="16" font-weight="700" fill="#7b4fb3" text-anchor="middle">Cas9</text><text x="170.0" y="318" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">The guide RNA (20 letters) leads</text><text x="170.0" y="338" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">Cas9 to its matching sequence</text><line x1="310.0" y1="236" x2="336.0" y2="236.0" stroke="#1f2a37" stroke-width="2.5"/><path d="M342.0 236 L333.9 239.9 L333.9 232.1 Z" fill="#1f2a37"/><rect x="345.0" y="100" width="270" height="250" rx="16" fill="#f4f6f9" stroke="#c0392b" stroke-width="2"/><text x="480.0" y="134" font-size="19" font-weight="700" fill="#c0392b" text-anchor="middle">2. Cut</text><rect x="370.0" y="232" width="102.0" height="10" rx="3" fill="#2b6cb0"/><rect x="488.0" y="232" width="102.0" height="10" rx="3" fill="#2b6cb0"/><rect x="370.0" y="256" width="102.0" height="10" rx="3" fill="#2b6cb0"/><rect x="488.0" y="256" width="102.0" height="10" rx="3" fill="#2b6cb0"/><g transform="translate(480.0,190)" stroke="#c0392b" stroke-width="3" fill="none"><circle cx="-12" cy="-14" r="8"/><circle cx="12" cy="-14" r="8"/><line x1="-7" y1="-8" x2="14" y2="22"/><line x1="7" y1="-8" x2="-14" y2="22"/></g><line x1="480.0" y1="222" x2="480.0" y2="272" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/><text x="480.0" y="318" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">Cas9 cuts both DNA strands</text><text x="480.0" y="338" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">at that exact spot</text><line x1="620.0" y1="236" x2="646.0" y2="236.0" stroke="#1f2a37" stroke-width="2.5"/><path d="M652.0 236 L643.9 239.9 L643.9 232.1 Z" fill="#1f2a37"/><rect x="655.0" y="100" width="270" height="250" rx="16" fill="#f4f6f9" stroke="#2f7d6d" stroke-width="2"/><text x="790.0" y="134" font-size="19" font-weight="700" fill="#2f7d6d" text-anchor="middle">3. Repair</text><text x="680.0" y="178" font-size="13" font-weight="700" fill="#1f2a37" text-anchor="start">A) No template</text><rect x="680.0" y="188" width="104.0" height="10" rx="3" fill="#2b6cb0"/><rect x="784.0" y="188" width="12" height="10" rx="3" fill="#c0392b"/><rect x="796.0" y="188" width="104.0" height="10" rx="3" fill="#2b6cb0"/><text x="680.0" y="222" font-size="12.5" font-weight="400" fill="#5b6573" text-anchor="start">the gene is switched off</text><text x="680.0" y="250" font-size="13" font-weight="700" fill="#1f2a37" text-anchor="start">B) With template</text><rect x="680.0" y="260" width="98.0" height="10" rx="3" fill="#2b6cb0"/><rect x="778.0" y="260" width="24" height="10" rx="3" fill="#2f7d6d"/><rect x="802.0" y="260" width="98.0" height="10" rx="3" fill="#2b6cb0"/><text x="680.0" y="294" font-size="12.5" font-weight="400" fill="#5b6573" text-anchor="start">it is corrected or inserted</text><text x="790.0" y="318" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">The cell repairs the cut</text><text x="790.0" y="338" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">and the change is made there</text><rect x="80" y="380" width="800" height="120" rx="14" fill="#fff" stroke="#d5dbe3"/><text x="480.0" y="412" font-size="17" font-weight="700" fill="#1f2a37" text-anchor="middle">What it is used for</text><text x="220.0" y="442" font-size="15" font-weight="700" fill="#c0392b" text-anchor="middle">Medicine</text><text x="220.0" y="464" font-size="13.5" font-weight="400" fill="#1f2a37" text-anchor="middle">Casgevy (2023): sickle</text><text x="220.0" y="483" font-size="13.5" font-weight="400" fill="#1f2a37" text-anchor="middle">cell and thalassaemia</text><text x="480.0" y="442" font-size="15" font-weight="700" fill="#2f7d6d" text-anchor="middle">Farming</text><text x="480.0" y="464" font-size="13.5" font-weight="400" fill="#1f2a37" text-anchor="middle">hardier crops</text><text x="480.0" y="483" font-size="13.5" font-weight="400" fill="#1f2a37" text-anchor="middle">without foreign DNA</text><text x="740.0" y="442" font-size="15" font-weight="700" fill="#2b6cb0" text-anchor="middle">Research</text><text x="740.0" y="464" font-size="13.5" font-weight="400" fill="#1f2a37" text-anchor="middle">switching genes off to</text><text x="740.0" y="483" font-size="13.5" font-weight="400" fill="#1f2a37" text-anchor="middle">learn what they do</text><text x="480.0" y="540" font-size="14" font-weight="400" fill="#5b6573" text-anchor="middle">Described in 2012 by Emmanuelle Charpentier and Jennifer Doudna, building on Francis Mojica&#x27;s work. Nobel Prize in Chemistry 2020.</text></svg>