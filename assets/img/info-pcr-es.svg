<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Cómo funciona la PCR" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Cómo funciona la PCR</title><rect width="960" height="600" rx="16" fill="#ffffff"/><text x="480.0" y="44" font-size="26" font-weight="700" fill="#1f2a37" text-anchor="middle">La PCR: fotocopiar ADN</text><text x="480.0" y="72" font-size="15" font-weight="400" fill="#5b6573" text-anchor="middle">Cada ciclo dura unos minutos y duplica el trozo de ADN buscado</text><rect x="45.0" y="100" width="260" height="250" rx="16" fill="#f4f6f9" stroke="#c0392b" stroke-width="2"/><text x="175.0" y="134" font-size="19" font-weight="700" fill="#c0392b" text-anchor="middle">1. Separar</text><rect x="127.0" y="146" width="96" height="28" rx="14" fill="#c0392b"/><text x="175.0" y="166" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">95 °C</text><rect x="75.0" y="205" width="200" height="10" rx="3" fill="#2b6cb0"/><rect x="75.0" y="245" width="200" height="10" rx="3" fill="#7b4fb3"/><line x1="175.0" y1="222" x2="175.0" y2="204.0" stroke="#c0392b" stroke-width="2.5"/><path d="M175.0 198 L178.9 206.1 L171.1 206.1 Z" fill="#c0392b"/><line x1="175.0" y1="228" x2="175.0" y2="246.0" stroke="#c0392b" stroke-width="2.5"/><path d="M175.0 252 L171.1 243.9 L178.9 243.9 Z" fill="#c0392b"/><text x="175.0" y="302" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">El calor abre la doble</text><text x="175.0" y="322" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">hélice en dos cadenas</text><line x1="311.0" y1="225" x2="340.0" y2="225.0" stroke="#1f2a37" stroke-width="2.5"/><path d="M346.0 225 L337.9 228.9 L337.9 221.1 Z" fill="#1f2a37"/><rect x="350.0" y="100" width="260" height="250" rx="16" fill="#f4f6f9" stroke="#2b6cb0" stroke-width="2"/><text x="480.0" y="134" font-size="19" font-weight="700" fill="#2b6cb0" text-anchor="middle">2. Unir cebadores</text><rect x="432.0" y="146" width="96" height="28" rx="14" fill="#2b6cb0"/><text x="480.0" y="166" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">≈ 55-65 °C</text><rect x="380.0" y="200" width="200" height="10" rx="3" fill="#2b6cb0"/><rect x="380.0" y="250" width="200" height="10" rx="3" fill="#7b4fb3"/><rect x="530.0" y="214" width="40" height="9" rx="3" fill="#e8a33d"/><rect x="390.0" y="236" width="40" height="9" rx="3" fill="#e8a33d"/><text x="550.0" y="240" font-size="12" font-weight="600" fill="#e8a33d" text-anchor="middle">cebador</text><text x="480.0" y="302" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">Dos trocitos de ADN marcan</text><text x="480.0" y="322" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">el principio y el final</text><line x1="616.0" y1="225" x2="645.0" y2="225.0" stroke="#1f2a37" stroke-width="2.5"/><path d="M651.0 225 L642.9 228.9 L642.9 221.1 Z" fill="#1f2a37"/><rect x="655.0" y="100" width="260" height="250" rx="16" fill="#f4f6f9" stroke="#2f7d6d" stroke-width="2"/><text x="785.0" y="134" font-size="19" font-weight="700" fill="#2f7d6d" text-anchor="middle">3. Copiar</text><rect x="737.0" y="146" width="96" height="28" rx="14" fill="#2f7d6d"/><text x="785.0" y="166" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">72 °C</text><rect x="685.0" y="200" width="200" height="10" rx="3" fill="#2b6cb0"/><rect x="775.0" y="214" width="110" height="9" rx="3" fill="#2f7d6d"/><rect x="835.0" y="214" width="40" height="9" rx="3" fill="#e8a33d"/><rect x="685.0" y="250" width="200" height="10" rx="3" fill="#7b4fb3"/><rect x="685.0" y="236" width="110" height="9" rx="3" fill="#2f7d6d"/><rect x="695.0" y="236" width="40" height="9" rx="3" fill="#e8a33d"/><line x1="825.0" y1="228" x2="771.0" y2="228.0" stroke="#2f7d6d" stroke-width="2.5"/><path d="M765.0 228 L773.1 224.1 L773.1 231.9 Z" fill="#2f7d6d"/><text x="785.0" y="302" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">La polimerasa Taq completa</text><text x="785.0" y="322" font-size="14" font-weight="400" fill="#1f2a37" text-anchor="middle">cada cadena nueva</text><text x="480.0" y="392" font-size="17" font-weight="700" fill="#1f2a37" text-anchor="middle">Y se repite: el número de copias se duplica en cada ciclo</text><rect x="92" y="412" width="16" height="12" rx="3" fill="#2b6cb0"/><text x="122" y="498" font-size="13" font-weight="600" fill="#5b6573" text-anchor="middle">inicio</text><line x1="180" y1="436" x2="216.0" y2="436.0" stroke="#5b6573" stroke-width="2.5"/><path d="M222 436 L213.9 439.9 L213.9 432.1 Z" fill="#5b6573"/><rect x="242" y="412" width="16" height="12" rx="3" fill="#2b6cb0"/><rect x="262" y="412" width="16" height="12" rx="3" fill="#2f7d6d"/><text x="272" y="498" font-size="13" font-weight="600" fill="#5b6573" text-anchor="middle">ciclo 1</text><line x1="330" y1="436" x2="366.0" y2="436.0" stroke="#5b6573" stroke-width="2.5"/><path d="M372 436 L363.9 439.9 L363.9 432.1 Z" fill="#5b6573"/><rect x="392" y="412" width="16" height="12" rx="3" fill="#2b6cb0"/><rect x="412" y="412" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="432" y="412" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="452" y="412" width="16" height="12" rx="3" fill="#2f7d6d"/><text x="422" y="498" font-size="13" font-weight="600" fill="#5b6573" text-anchor="middle">ciclo 2</text><line x1="480" y1="436" x2="516.0" y2="436.0" stroke="#5b6573" stroke-width="2.5"/><path d="M522 436 L513.9 439.9 L513.9 432.1 Z" fill="#5b6573"/><rect x="542" y="412" width="16" height="12" rx="3" fill="#2b6cb0"/><rect x="562" y="412" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="582" y="412" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="602" y="412" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="542" y="430" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="562" y="430" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="582" y="430" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="602" y="430" width="16" height="12" rx="3" fill="#2f7d6d"/><text x="572" y="498" font-size="13" font-weight="600" fill="#5b6573" text-anchor="middle">ciclo 3</text><line x1="630" y1="436" x2="666.0" y2="436.0" stroke="#5b6573" stroke-width="2.5"/><path d="M672 436 L663.9 439.9 L663.9 432.1 Z" fill="#5b6573"/><rect x="692" y="412" width="16" height="12" rx="3" fill="#2b6cb0"/><rect x="712" y="412" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="732" y="412" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="752" y="412" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="692" y="430" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="712" y="430" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="732" y="430" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="752" y="430" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="692" y="448" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="712" y="448" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="732" y="448" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="752" y="448" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="692" y="466" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="712" y="466" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="732" y="466" width="16" height="12" rx="3" fill="#2f7d6d"/><rect x="752" y="466" width="16" height="12" rx="3" fill="#2f7d6d"/><text x="722" y="498" font-size="13" font-weight="600" fill="#5b6573" text-anchor="middle">ciclo 4</text><line x1="768" y1="436" x2="796.0" y2="436.0" stroke="#5b6573" stroke-width="2.5"/><path d="M802 436 L793.9 439.9 L793.9 432.1 Z" fill="#5b6573"/><text x="880" y="432" font-size="15" font-weight="700" fill="#1f2a37" text-anchor="middle">30 ciclos</text><text x="880" y="454" font-size="15" font-weight="700" fill="#2f7d6d" text-anchor="middle">≈ 1.000 millones</text><text x="880" y="474" font-size="13" font-weight="400" fill="#5b6573" text-anchor="middle">de copias</text><text x="480.0" y="548" font-size="14.5" font-weight="400" fill="#5b6573" text-anchor="middle">Inventada por Kary Mullis en 1983. Se usa en diagnóstico, medicina forense, test de COVID-19 e investigación.</text></svg>